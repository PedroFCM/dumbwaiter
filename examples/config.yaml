# Example dumbwaiter configuration.
#
# Local-first: every route runs on Ollama and the classifier embeds in-process, so this
# config needs no cloud credentials. The model ids are the ones `ollama list` showed on
# the machine this was written on; swap in whatever you have pulled.

default_route: simple
min_confidence: 0.15

classifier:
  type: embedding
  backend: local

routes:
  - name: simple
    model: ollama/llama3.1:latest
    tier: 0
    description: Short factual questions, translations, and light summarization.
    examples:
      - what time is it in Lisbon
      - summarize this paragraph in two sentences
      - translate this to European Portuguese
      - what does this acronym stand for
      - reformat this list as bullet points

  # Several routes can share a rung: these differ in task, not in cost.
  - name: code
    model: ollama/gemma4:latest
    tier: 1
    description: Reading, writing, and debugging code.
    examples:
      - refactor this module to remove the duplicated validation
      - why does this test fail intermittently
      - write a pytest fixture that stubs the S3 client
      - explain what this regex matches
      - convert this script to async

  - name: complex
    model: ollama/gemma4:latest
    tier: 1
    description: Open-ended reasoning, architecture, and multi-step analysis.
    examples:
      - design a distributed rate limiter and justify the tradeoffs
      - prove this invariant holds for all inputs
      - compare three approaches to this migration and recommend one
      - analyze this incident timeline and identify the root cause
      - plan a rollout strategy for this breaking API change

  # A cloud rung is optional. Uncomment it, give it tier 2, and install the extra
  # (`dumbwaiter[anthropic]`). Cloud routes need credentials; the local ones above do not.
  #
  # - name: frontier
  #   model: anthropic/claude-sonnet-5
  #   tier: 2
  #   examples: [...]

policy:
  escalate_on_error: true
  escalate_on_refusal: true
  max_escalations: 2
  # Only bites once a priced cloud route is on the ladder; local models cost 0.
  max_cost_per_request_usd: 0.05

log_path: ./decisions.jsonl
