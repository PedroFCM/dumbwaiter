name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to a PR makes the in-flight run irrelevant.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the version developed against. The versions in
        # between are covered transitively; widen this if a floor-only break slips out.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Install
        # --locked fails rather than silently resolving something else, so CI runs the
        # exact dependency set the lockfile describes.
        run: uv sync --all-extras --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov
